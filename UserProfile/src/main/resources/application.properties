server.port=5005
spring.application.name=USER-PROFILE

# Database Configuration: MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/UserAccount
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# Spring Security (Commented out)
# spring.security.user.name=shriansh
# spring.security.user.password=password

# Management Endpoints
spring.management.endpoints.web.exposure.include=*

# Eureka Configuration
eureka.instance.client.serverUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost


# Environment-Based Message
message=Default message loaded...
spring.profiles.active=dev


spring.web.resources.static-locations=file:./src/main/resources/static/

